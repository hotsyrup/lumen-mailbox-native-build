name: Synthetic native dependency checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - name: Install public build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev ca-certificates bzip2 binutils patchelf
      - name: Build and test synthetic dependencies
        run: env -i PATH="$PATH" HOME=/tmp GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash scripts/build.sh
      - name: Upload dependency-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-native-dependencies-arm64
          path: dist/native-dependencies.zip
          if-no-files-found: error
          retention-days: 1
